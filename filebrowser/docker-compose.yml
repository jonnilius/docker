services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped

    ports:
      - 8081:80

    environment:
      - FB_ROOT=/srv
      - FB_DATABASE=/database/filebrowser.db
      - FB_CONFIG=/config/settings.json

    volumes:
      - /home/john-andreas/:/srv
      - /docker/appdata/filebrowser/database:/database
      - /docker/appdata/filebrowser/config:/config
